name: Update board

on:
  schedule:
    # The main timer is cron-job.org, which starts this workflow hourly 10 AM-8 PM Eastern
    # (workflow_dispatch). These two GitHub schedules are only a backup; GitHub often runs them late.
    # 14:44 UTC = 9:44 AM Eastern (winter) / 10:44 AM (summer), ahead of Sunday's 1 PM kickoffs.
    # 21:44 UTC = 4:44 PM Eastern (winter) / 5:44 PM (summer), ahead of NBA tip-offs and night games.
    - cron: "44 14 * * *"
    - cron: "44 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build today's board
        run: python3 build_board.py data/board.json

      - name: Commit the new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898182+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Board unchanged."
          else
            git commit -m "Update board $(date -u +%Y-%m-%d)"
            # if something else was pushed meanwhile, replay this run's data on top (this run's data wins)
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 10
            done
          fi
